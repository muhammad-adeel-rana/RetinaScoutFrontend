<header class="header">
  <div class="container header-content">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="logo.png" alt="RetinaScout" class="logo-icon" />
      <span class="logo-text">Retina<span class="logo-accent">Scout</span></span>
    </a>

    <nav class="navigation" [class.nav-open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link"
        (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link" (click)="closeMenu()">About us</a>
      <a routerLink="/pricing" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Pricing</a>
      <a routerLink="/blog" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Blog</a>
      <a routerLink="/signup" class="btn btn-primary nav-cta-mobile" (click)="closeMenu()">Join us</a>
    </nav>

    <a routerLink="/signup" class="btn btn-primary nav-cta-desktop">Join us</a>

    <button class="hamburger" [class.hamburger--open]="menuOpen" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
